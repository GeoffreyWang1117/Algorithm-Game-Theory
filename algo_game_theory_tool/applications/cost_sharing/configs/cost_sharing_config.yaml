  # Computation parameters
  computation:
    method: 'exact'  # 'exact', 'monte_carlo', 'incremental'
    num_samples: 5000
    seed: 42


# =============================================================================
# Shapley Value Computation
# =============================================================================
shapley_computation:
  # Algorithm selection based on problem size
  algorithm_selection:
    exact_threshold: 12      # Use exact for n ≤ 12
    incremental_threshold: 10  # Use incremental for n ≤ 10
    default_samples: 10000   # Default Monte Carlo samples for large n

  # Monte Carlo parameters
  monte_carlo:
    min_samples: 1000
    max_samples: 100000
    convergence_threshold: 0.01  # Stop if error < 1%

  # Performance settings
  performance:
    cache_enabled: true
    parallel_computation: false  # Set true for multiprocessing
    num_workers: 4


# =============================================================================
# Visualization
# =============================================================================
visualization:
  output_dir: 'visualization'

  # Plot settings
  figure_size:
    width: 14
    height: 10

  dpi: 300

  # Style
  style: 'whitegrid'  # seaborn style

  # Colors
  colors:
    shapley: 'steelblue'
    proportional: 'coral'
    equal_split: 'mediumseagreen'
    savings: 'green'
    loss: 'red'

  # Font sizes
  font_sizes:
    title: 14
    axis_label: 12
    tick_label: 10
    legend: 10


# =============================================================================
# Analysis
# =============================================================================
analysis:
  # Fairness properties to verify
  verify_properties:
    - 'efficiency'           # Σφᵢ = v(N)
    - 'individual_rationality'  # φᵢ ≤ c({i})
    - 'core_membership'      # No blocking coalitions
    - 'symmetry'            # Symmetric players get equal value

  # Tolerance for numerical comparisons
  numerical_tolerance: 1.0e-6

  # Comparison methods
  comparison_methods:
    - 'shapley'       # Shapley value
    - 'proportional'  # Proportional to resource usage
    - 'equal_split'   # Everyone pays equally
    - 'standalone'    # No sharing (baseline)


# =============================================================================
# Output
# =============================================================================
output:
  # Report format
  report_format: 'text'  # 'text', 'json', 'csv'

  # Precision for monetary values
  monetary_precision: 2

  # Precision for percentages
  percentage_precision: 1

  # Save results
  save_results: true
  results_dir: 'results'

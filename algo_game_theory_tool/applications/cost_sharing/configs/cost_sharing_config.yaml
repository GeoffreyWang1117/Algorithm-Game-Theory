# Cost Sharing System Configuration
# Configuration for Shapley value-based cost allocation applications

# =============================================================================
# Cloud Computing Cost Sharing
# =============================================================================
cloud_cost_sharing:
  # Cost model parameters
  cost_model:
    fixed_cost_monthly: 50000  # Monthly data center fixed costs ($)
    cpu_price_per_core: 30     # Price per vCPU per month ($)
    memory_price_per_gb: 5     # Price per GB RAM per month ($)
    storage_price_per_gb: 0.1  # Price per GB storage per month ($)
    network_price_per_gbps: 100  # Price per Gbps bandwidth per month ($)
    scale_discount_rate: 0.15  # Economies of scale discount rate (15% max)

  # Customer scenarios
  scenarios:
    # Scenario 1: Small startup team
    startup:
      - id: 'web_app'
        name: 'Web Application'
        cpu_cores: 4
        memory_gb: 16
        storage_gb: 100
        network_gbps: 1

      - id: 'database'
        name: 'Database Server'
        cpu_cores: 8
        memory_gb: 64
        storage_gb: 500
        network_gbps: 2

      - id: 'analytics'
        name: 'Analytics Pipeline'
        cpu_cores: 16
        memory_gb: 128
        storage_gb: 1000
        network_gbps: 5

    # Scenario 2: Enterprise departments
    enterprise:
      - id: 'eng_team'
        name: 'Engineering Team'
        cpu_cores: 32
        memory_gb: 128
        storage_gb: 2000
        network_gbps: 10
        priority: 2

      - id: 'data_science'
        name: 'Data Science Team'
        cpu_cores: 64
        memory_gb: 512
        storage_gb: 10000
        network_gbps: 20
        priority: 2

      - id: 'web_services'
        name: 'Web Services'
        cpu_cores: 16
        memory_gb: 64
        storage_gb: 500
        network_gbps: 50
        priority: 1

      - id: 'analytics'
        name: 'Analytics Team'
        cpu_cores: 24
        memory_gb: 192
        storage_gb: 5000
        network_gbps: 5
        priority: 1

      - id: 'dev_test'
        name: 'Dev/Test Environment'
        cpu_cores: 8
        memory_gb: 32
        storage_gb: 200
        network_gbps: 2
        priority: 1

  # Computation parameters
  computation:
    method: 'exact'  # 'exact', 'monte_carlo', 'incremental'
    num_samples: 10000  # For Monte Carlo approximation
    seed: 42


# =============================================================================

          lon: -122.3994
        max_detour_miles: 5.0

      - id: 'carol'
        name: 'Carol'
        pickup:
          name: 'Carol Home'
          lat: 37.7749
          lon: -122.4394
        dropoff:
          name: 'Office Building B'
          lat: 37.7999
          lon: -122.3944
        max_detour_miles: 4.0

      - id: 'dave'
